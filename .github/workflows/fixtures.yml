name: fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --junitxml=junit-results.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit-results.xml
          retention-days: 1

  flakeguard:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: Arggon/flakeguard-action@50c1c0a867ad598cd640ed75b73e2968990ffedb
        with:
          artifact-pattern: "junit*"
          lookback-runs: "2"
      - name: Upload FlakeGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakeguard-report
          path: flakeguard-report
          retention-days: 1

  flakeguard-diagnostic:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Missing artifacts must fail loudly
        id: missing
        continue-on-error: true
        uses: Arggon/flakeguard-action@50c1c0a867ad598cd640ed75b73e2968990ffedb
        with:
          artifact-pattern: "does-not-exist-*"
      - name: Assert the action failed with a diagnostic
        run: |
          if [ "${{ steps.missing.outcome }}" != "failure" ]; then
            echo "expected the action to fail when no artifacts match"
            exit 1
          fi
